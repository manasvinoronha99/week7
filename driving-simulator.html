<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Simulator - Head & Hand Tracking</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #90EE90 100%);
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .video-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 3px solid white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .indicators {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .indicator {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .arrow {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin-left: 10px;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .active {
            transform: scale(1.3);
            color: #00ff00;
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>

        <div class="video-preview">
            <video id="webcam" autoplay playsinline></video>
        </div>

        <div class="indicators">
            <div class="indicator">
                <strong>Head Tilt:</strong>
                <span class="arrow" id="tiltLeft">←</span>
                <span class="arrow" id="tiltRight">→</span>
            </div>
            <div class="indicator">
                <strong>Lane:</strong>
                <span id="currentLane">Center</span>
            </div>
            <div class="indicator">
                <strong>Speed:</strong>
                <span id="speed">0</span> km/h
            </div>
        </div>

        <div class="status" id="status">Initializing camera...</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');

        // Game state
        let carX = 0;
        let carY = 0;
        let targetCarX = 0;
        let roadOffset = 0;
        let currentLane = 1; // 0: left, 1: center, 2: right
        let headTilt = 0;
        let targetHeadTilt = 0;
        let speed = 60;
        let obstacles = [];

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            carX = canvas.width / 2;
            carY = canvas.height - 150;
            targetCarX = carX;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // MediaPipe setup
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Face mesh results
        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Calculate head tilt using nose and forehead points
                const noseTip = landmarks[1];
                const leftEye = landmarks[33];
                const rightEye = landmarks[263];

                const eyeCenterX = (leftEye.x + rightEye.x) / 2;
                const tilt = (noseTip.x - eyeCenterX) * 2;

                targetHeadTilt = Math.max(-1, Math.min(1, tilt * 3));

                document.getElementById('status').textContent = 'Tracking Active';
            }
        });

        // Hand tracking results
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const handedness = results.multiHandedness[i].label;

                    // Get wrist position
                    const wrist = landmarks[0];

                    // Lane switching based on hand position
                    if (handedness === 'Left' && wrist.x < 0.3) {
                        changeLane(-1);
                    } else if (handedness === 'Right' && wrist.x > 0.7) {
                        changeLane(1);
                    }
                }
            }
        });

        // Camera setup
        const camera = new Camera(video, {
            onFrame: async () => {
                await faceMesh.send({image: video});
                await hands.send({image: video});
            },
            width: 640,
            height: 480
        });

        camera.start();

        // Lane changing
        let lastLaneChange = 0;
        function changeLane(direction) {
            const now = Date.now();
            if (now - lastLaneChange < 500) return; // Debounce

            lastLaneChange = now;
            currentLane = Math.max(0, Math.min(2, currentLane + direction));

            const laneWidth = canvas.width * 0.25;
            const centerX = canvas.width / 2;
            targetCarX = centerX + (currentLane - 1) * laneWidth;

            const laneNames = ['Left', 'Center', 'Right'];
            document.getElementById('currentLane').textContent = laneNames[currentLane];
        }

        // Update indicators
        function updateIndicators() {
            const tiltLeft = document.getElementById('tiltLeft');
            const tiltRight = document.getElementById('tiltRight');

            tiltLeft.classList.toggle('active', headTilt < -0.2);
            tiltRight.classList.toggle('active', headTilt > 0.2);

            document.getElementById('speed').textContent = Math.round(speed);
        }

        // Obstacle management
        function createObstacle() {
            const lanes = [0, 1, 2];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const laneWidth = canvas.width * 0.25;
            const centerX = canvas.width / 2;

            obstacles.push({
                x: centerX + (lane - 1) * laneWidth,
                y: -50,
                width: 50,
                height: 80,
                lane: lane
            });
        }

        // Game loop
        function gameLoop() {
            // Smooth easing
            headTilt += (targetHeadTilt - headTilt) * 0.15;
            carX += (targetCarX - carX) * 0.1;

            // Apply head tilt to fine steering
            const steerAmount = headTilt * 50;
            const finalCarX = carX + steerAmount;

            // Move road
            roadOffset += speed / 10;
            if (roadOffset > 100) roadOffset = 0;

            // Update obstacles
            obstacles = obstacles.filter(obs => obs.y < canvas.height + 100);
            obstacles.forEach(obs => obs.y += speed / 10);

            // Create new obstacles
            if (Math.random() < 0.02) {
                createObstacle();
            }

            // Draw
            draw(finalCarX);
            updateIndicators();

            requestAnimationFrame(gameLoop);
        }

        function draw(finalCarX) {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

            // Grass
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);

            // Road
            const roadWidth = canvas.width * 0.75;
            const roadLeft = (canvas.width - roadWidth) / 2;

            ctx.fillStyle = '#555';
            ctx.fillRect(roadLeft, 0, roadWidth, canvas.height);

            // Road lines
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5;
            ctx.setLineDash([30, 20]);

            for (let i = 0; i < 3; i++) {
                const lineX = roadLeft + (roadWidth / 3) * i;
                if (i > 0) {
                    ctx.beginPath();
                    ctx.moveTo(lineX, -roadOffset);
                    ctx.lineTo(lineX, canvas.height + roadOffset);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);

            // Road edges
            ctx.fillStyle = '#fff';
            ctx.fillRect(roadLeft - 10, 0, 10, canvas.height);
            ctx.fillRect(roadLeft + roadWidth, 0, 10, canvas.height);

            // Draw obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(obs.x - obs.width/2, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(obs.x - obs.width/2 + 5, obs.y + 10, 15, 25);
                ctx.fillRect(obs.x + obs.width/2 - 20, obs.y + 10, 15, 25);
            });

            // Draw car
            ctx.save();
            ctx.translate(finalCarX, carY);

            // Car body
            ctx.fillStyle = '#3498db';
            ctx.fillRect(-30, -40, 60, 80);

            // Car windows
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(-25, -35, 50, 30);

            // Car wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-30, -25, 10, 20);
            ctx.fillRect(20, -25, 10, 20);
            ctx.fillRect(-30, 5, 10, 20);
            ctx.fillRect(20, 5, 10, 20);

            ctx.restore();
        }

        gameLoop();
    </script>
</body>
</html>
